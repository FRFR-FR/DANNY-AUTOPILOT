name: Bootstrap DANNY AUTOPILOT
on:
  push:
    branches: [main]
    paths: [bootstrap.zip]
permissions:
  contents: write
jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install project files
        run: |
          unzip -o bootstrap.zip
          cp -R danny-autopilot-github/. .
          rm -rf danny-autopilot-github bootstrap.zip .github/workflows/bootstrap-repository.yml
      - name: Commit project
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Install DANNY AUTOPILOT project files"
          git push
