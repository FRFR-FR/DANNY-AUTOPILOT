name: Cartesia — Glasswing full debate voiceover

on:
  push:
    branches: [main]
    paths:
      - 'production/glasswing_cartesia/**'
      - 'cartesia_api/generate_timed_debate.py'
      - 'requirements-glasswing-cartesia.txt'
      - '.github/workflows/cartesia-glasswing-debate.yml'
  workflow_dispatch:
    inputs:
      silent_video_url:
        description: Optional direct-download URL for glasswing_full_silent.mp4
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: cartesia-glasswing-voiceover
  cancel-in-progress: false

jobs:
  narrate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install ffmpeg and Python
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
          ffmpeg -version | head -n 1
          python --version

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-glasswing-cartesia.txt

      - name: Install Cartesia and audio dependencies
        run: python -m pip install -r requirements-glasswing-cartesia.txt

      - name: Generate all 44 timecoded dialogue lines
        env:
          CARTESIA_API_KEY: ${{ secrets.CARTESIA_API_KEY }}
        run: |
          set -euo pipefail
          python -m py_compile cartesia_api/generate_timed_debate.py
          python cartesia_api/generate_timed_debate.py --dialogue production/glasswing_cartesia/dialogue.json --output-dir out/glasswing-cartesia

      - name: Download silent picture when a URL was supplied
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.silent_video_url != '' }}
        env:
          VIDEO_URL: ${{ inputs.silent_video_url }}
        run: |
          set -euo pipefail
          mkdir -p input
          case "$VIDEO_URL" in https://*) ;; *) echo "A direct HTTPS download URL is required"; exit 2;; esac
          curl --fail --location --retry 3 --retry-delay 2 "$VIDEO_URL" -o input/glasswing_full_silent.mp4
          test -s input/glasswing_full_silent.mp4

      - name: Mux Cartesia narration into silent MP4
        if: ${{ (github.event_name == 'workflow_dispatch' && inputs.silent_video_url != '') }}
        run: |
          set -euo pipefail
          ffprobe -v error -show_entries stream=codec_type,width,height,r_frame_rate -show_entries format=duration -of json input/glasswing_full_silent.mp4 > out/glasswing-cartesia/source-video-probe.json
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('out/glasswing-cartesia/source-video-probe.json').read_text())
          v=next(s for s in p['streams'] if s['codec_type']=='video')
          d=float(p['format']['duration'])
          assert (v['width'],v['height'])==(1280,720), v
          assert v['r_frame_rate']=='30/1', v
          assert abs(d-318.4)<0.20, d
          print(f"SILENT_VIDEO_OK {d:.3f}s 1280x720 30fps")
          PY
          ffmpeg -hide_banner -y -i input/glasswing_full_silent.mp4 -i out/glasswing-cartesia/dialogue.wav -map 0:v:0 -map 1:a:0 -c:v copy -c:a aac -b:a 192k -ar 44100 -t 318.4 -movflags +faststart out/glasswing-cartesia/glasswing-full-cartesia.mp4
          ffprobe -v error -show_entries stream=codec_type,codec_name,width,height,r_frame_rate -show_entries format=duration -of json out/glasswing-cartesia/glasswing-full-cartesia.mp4 > out/glasswing-cartesia/final-video-probe.json

      - name: Upload narration and final video
        uses: actions/upload-artifact@v4
        with:
          name: glasswing-cartesia-delivery
          path: out/glasswing-cartesia/
          if-no-files-found: error
          retention-days: 90
